name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-imports:
    name: Lint & import smoke test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip & install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install runtime dependencies
        run: |
          pip install -r requirements.txt

      - name: Install dev tools (skip heavy DL libs for CI speed)
        run: |
          pip install ruff black isort

      - name: Ruff (lint)
        run: ruff check src/

      - name: Black (format check)
        run: black --check --line-length 100 src/

      - name: isort (import order check)
        run: isort --check-only --profile black src/

      - name: Compile-check all modules (import smoke test)
        run: |
          python -m compileall -q src/ train.py || true
          # compileall above may fail on optional deps; do a soft ast parse instead:
          python -c "
          import ast, pathlib, sys
          errs = []
          for p in pathlib.Path('src').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errs.append(f'{p}: {e}')
          if errs:
              print('\n'.join(errs)); sys.exit(1)
          print('All src/ modules parse cleanly.')
          "
